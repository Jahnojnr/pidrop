name: Android debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            echo "::error::Android SDK Platform 35 is not installed on the runner."
            exit 1
          fi
          echo "Android SDK Platform 35 is available."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain > /tmp/pidrop-gradle.log 2>&1
          result=$?
          cat /tmp/pidrop-gradle.log
          if [ "$result" -ne 0 ]; then
            # Make actionable build failures visible in GitHub's check annotations.
            grep -E '(^e: |^\* What went wrong:|^> |^Execution failed|^A problem occurred|^FAILURE:|^error:|^Caused by:)' /tmp/pidrop-gradle.log | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$result"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PIDROP-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PIDROP-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
